
# Accretion Shell — Kitty

# Font
font_family      Monaspace Argon Frozen
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never

# Colors
background           #0B1B26
foreground           #F2E8D5
selection_background #252B38
selection_foreground #F2E8D5

# Window
background_opacity    1
window_padding_width  1
hide_window_decorations yes
draw_minimal_borders no

# Cursor
cursor                 #A6C8FF
cursor_trail           10
cursor_trail_decay     0.1 0.4

# Borders
active_border_color    #89B4FA
inactive_border_color  #343C4D

# Tab Bar
tab_bar_edge            top
tab_bar_style           powerline
tab_separator           " //"

active_tab_foreground   #F2E8D5
active_tab_background   #252B38
inactive_tab_foreground #7F9AAE
inactive_tab_background #0B1B26

# Performance
repaint_delay   10
input_delay     3
sync_to_monitor yes

# Dynamic opacity
dynamic_background_opacity yes
