
# Accretion Shell — Kitty

# Font
font_family      Monaspace Argon Frozen
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures never

# Colors
background           #5E3836
foreground           #FFF2E6
selection_background #91524D
selection_foreground #FFF2E6

# Window
background_opacity    1
window_padding_width  1
hide_window_decorations yes
draw_minimal_borders no

# Cursor
cursor                 #FFA07A
cursor_trail           10
cursor_trail_decay     0.1 0.4

# Borders
active_border_color    #FF8359
inactive_border_color  #A85E57

# Tab Bar
tab_bar_edge            top
tab_bar_style           powerline
tab_separator           " //"

active_tab_foreground   #FFF2E6
active_tab_background   #91524D
inactive_tab_foreground #F0AC9B
inactive_tab_background #5E3836

# Performance
repaint_delay   10
input_delay     3
sync_to_monitor yes

# Dynamic opacity
dynamic_background_opacity yes
