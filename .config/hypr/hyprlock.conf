$font = Monaspace Argon Frozen
$icons = Symbols Nerd Font
$cream = rgba(F2E8D5FF)
$muted = rgba(D9CDB8DD)
$blue = rgba(061C26D9)
$border = rgba(2A526EAA)
$accent = rgba(7F9AAEFF)
$scripts = ~/.config/hypr/scripts

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}


background {
    monitor = 
    path = ~/.config/hypr/img/bgLock.png
    blur_passes = 0
    brightness = 0.8
    contrast = 1.05
    vibrancy = 0.15
}


shape {
    monitor =
    size = 33%, 100%
    color = $blue
    rounding = 0
    zindex = 0

    position = 0, 0
    halign = left
    valign = top
}


label {
    monitor =
    text = Welcome back $USER
    color = $muted
    font_size = 20
    font_family = $font
    zindex = 1

    position = -33%, 5%
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $cream
    font_size = 76
    font_family = $font
    zindex = 1

    position = -33%, 30%
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000088)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $muted
    font_size = 14
    font_family = $font
    zindex = 1

    position = -33%, 25%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/weather.sh head
    color = $cream
    font_size = 30
    font_family = $font
    zindex = 1

    position = -33%, 19%
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/weather.sh desc
    color = $muted
    font_size = 14
    font_family = $font
    zindex = 1

    position = -33%, 15%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/weather.sh extra
    color = $accent
    font_size = 11
    font_family = $font
    zindex = 1

    position = -33%, 12%
    halign = center
    valign = center
}

input-field {
    monitor =
    zindex = 1

    size = 300, 50
    outline_thickness = 2
    rounding = 50%

    outer_color = $border
    inner_color = $blue
    font_color = $cream

    font_family = $font
    font_size = 14

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    placeholder_text = <span foreground="##2A526EAA">Feed me...</span>
    hide_input = false
    fade_on_empty = false

    check_color = rgba(80CFA0FF)
    fail_color = rgba(C56B62FF)
    fail_text = <span foreground="##F2E8D5">$FAIL</span>
    fail_timeout = 2000
    fail_transition = 300

    position = -33%, 0
    halign = center
    valign = center
}
