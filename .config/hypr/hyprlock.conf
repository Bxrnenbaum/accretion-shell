source = ~/.config/hypr/hyprlockTheme.conf

$icons = Symbols Nerd Font
$scripts = ~/.config/hypr/scripts

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}


background {
    monitor = 
    path = ~/.config/hypr/img/bgLock.png
    blur_passes = 0
    brightness = 0.8
    contrast = 1.05
    vibrancy = 0.15
}


shape {
    monitor =
    size = 33%, 100%
    color = $blue
    rounding = 0
    zindex = 0

    position = 0, 0
    halign = left
    valign = top
}


label {
    monitor =
    text = Welcome back $USER
    color = $muted
    font_size = $fontSizeGreeting
    font_family = $font
    zindex = 1

    position = -33%, 5%
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $cream
    font_size = $fontSizeClock
    font_family = $font
    zindex = 1

    position = -33%, 30%
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadowStrong
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $muted
    font_size = $fontSizeSmall
    font_family = $font
    zindex = 1

    position = -33%, 25%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/weather.sh head
    color = $cream
    font_size = $fontSizeWeather
    font_family = $font
    zindex = 1

    position = -33%, 19%
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
    shadow_color = $shadow
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/weather.sh desc
    color = $muted
    font_size = $fontSizeSmall
    font_family = $font
    zindex = 1

    position = -33%, 15%
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/weather.sh extra
    color = $accent
    font_size = $fontSizeTiny
    font_family = $font
    zindex = 1

    position = -33%, 12%
    halign = center
    valign = center
}

input-field {
    monitor =
    zindex = 1

    size = $inputSize
    outline_thickness = $inputOutline
    rounding = $inputRounding

    outer_color = $border
    inner_color = $blue
    font_color = $cream

    font_family = $font
    font_size = 14

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    placeholder_text = <span foreground="$border">Feed me...</span>
    hide_input = false
    fade_on_empty = false

    check_color = $success
    fail_color = $error
    fail_text = <span foreground="$cream">$FAIL</span>
    fail_timeout = 2000
    fail_transition = 300

    position = -33%, 0
    halign = center
    valign = center
}
